name: Génération quotidienne des vidéos Quran Studio

on:
  schedule:
    # 6h00 UTC chaque jour. Ajustez selon votre fuseau horaire — par exemple
    # pour 8h00 heure de Paris (UTC+2 en été), utilisez '0 6 * * *'.
    - cron: '0 6 * * *'
  workflow_dispatch: {}
    # Permet aussi de lancer le job manuellement depuis l'onglet "Actions"
    # du dépôt, pratique pour tester sans attendre le lendemain.

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install

      - name: Installer Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Générer les vidéos et les envoyer vers Google Drive
        env:
          APP_URL: ${{ secrets.APP_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: node automate.js
